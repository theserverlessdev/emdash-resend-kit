name: Release

# Publish to npm with trusted publishing (OIDC). The repository holds no npm token.
# The one-time setup is in CONTRIBUTING.md.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write # Create the GitHub release.
      id-token: write # Get the OIDC token for npm trusted publishing and provenance.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "The tag ${GITHUB_REF_NAME} does not match the package version ${version}." >&2
            exit 1
          fi
      - name: Install
        run: npm ci
      - name: Run all checks
        run: npm run check
      - name: Publish
        # Trusted publishing needs npm 11.5.1 or later. Provenance is automatic.
        run: |
          npm install --global npm@latest
          npm publish --access public
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
